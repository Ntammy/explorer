<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Profile card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <div class="container1">
      <div class="card">
    <div class="card-body">
      <div class="card-header"></div>
    <div class="img1">
    <img src="images/image-victor.jpg" alt="image of Victor" class="circle-img">
    </div>
    <div class="container2">
      <h3 class="username">
    Victor Crest <span class="user-age">26</span>
    </h3>
    <p class="location">London</p>
    </div>
    <hr class="divider">
    <div class="sub-text1">
      <div class="sb0">
      <span class="follower-no">80K</span>
      <p>Followers</p>
      </div>
      <div class="sb1">
      <span class="like-no">803K</span>
       <p>Likes</p>
      </div>
      <div class="sb2">
      <span class="photo-no"> 1.4K</span>
      <p>Photos</p>
      </div>
      </div>
      </div>
    </div>
  </div>
  <!-- Victor Crest
  26
  London

  80K
  Followers

  803K
  Likes

  1.4K
  Photos -->
</body>
</html>
